name: Test version input handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Create a fake curl and install script that records the requested version
      - name: Set up fake curl and version-recording install script
        run: |
          # Create a fake install script that records the DAGGER_VERSION env var
          cat > /tmp/fake-dagger-install.sh << 'INSTALL_EOF'
          #!/bin/sh
          set -e
          BIN_DIR="${BIN_DIR:-/usr/local/bin}"
          mkdir -p "$BIN_DIR"
          # Record the version that was requested
          echo "DAGGER_VERSION=${DAGGER_VERSION}" > /tmp/dagger-install-args.txt
          echo "DAGGER_COMMIT=${DAGGER_COMMIT}" >> /tmp/dagger-install-args.txt
          # Create a fake dagger binary
          cat > "$BIN_DIR/dagger" << 'DAGGER_EOF'
          #!/bin/sh
          if [ "$1" = "--silent" ] && [ "$2" = "version" ]; then
            echo "dagger v0.18.0 linux/amd64"
          elif [ "$1" = "version" ]; then
            echo "dagger v0.18.0 linux/amd64"
          else
            echo "fake dagger: $*"
          fi
          DAGGER_EOF
          chmod +x "$BIN_DIR/dagger"
          echo "Fake dagger installed to $BIN_DIR/dagger"
          INSTALL_EOF
          chmod +x /tmp/fake-dagger-install.sh

          # Create a fake curl
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'CURL_EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *dagger/install.sh*|*dagger/versions/latest*)
              if echo "$*" | grep -q "versions/latest"; then
                echo "v0.18.0"
                exit 0
              fi
              if [ -n "$out" ]; then
                cat /tmp/fake-dagger-install.sh > "$out"
              else
                cat /tmp/fake-dagger-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL_EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      # Test with a specific version (without 'v' prefix — action should add it)
      - id: action
        uses: .
        with:
          version: "0.18.0"
          # No call/args — install only

      - name: Assert dagger binary is installed
        run: |
          if ! command -v dagger > /dev/null 2>&1; then
            echo "FAIL: dagger binary not found in PATH"
            exit 1
          fi
          echo "PASS: dagger binary found"

      - name: Assert version was passed with v prefix to install script
        run: |
          if [ ! -f /tmp/dagger-install-args.txt ]; then
            echo "FAIL: install args file not found — install script may not have run"
            exit 1
          fi
          cat /tmp/dagger-install-args.txt
          RECORDED_VERSION=$(grep "^DAGGER_VERSION=" /tmp/dagger-install-args.txt | cut -d= -f2)
          echo "Recorded version: '$RECORDED_VERSION'"
          if [ "$RECORDED_VERSION" != "v0.18.0" ]; then
            echo "FAIL: expected version 'v0.18.0' but got '$RECORDED_VERSION'"
            echo "The action should add 'v' prefix to version inputs that don't start with 'v'"
            exit 1
          fi
          echo "PASS: version correctly prefixed with 'v'"
