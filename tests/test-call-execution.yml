name: Test dagger call execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a fake dagger binary and fake curl so we can test the exec path
      - name: Set up fake dagger binary and curl
        run: |
          # Create a fake install script that installs a fake dagger binary
          cat > /tmp/fake-dagger-install.sh << 'INSTALL_EOF'
          #!/bin/sh
          set -e
          BIN_DIR="${BIN_DIR:-/usr/local/bin}"
          mkdir -p "$BIN_DIR"
          cat > "$BIN_DIR/dagger" << 'DAGGER_EOF'
          #!/bin/sh
          # Record all arguments for inspection
          echo "dagger-args: $*" >> /tmp/dagger-calls.log
          if [ "$1" = "--silent" ] && [ "$2" = "version" ]; then
            echo "dagger v0.18.0 linux/amd64"
            exit 0
          fi
          if [ "$1" = "version" ]; then
            echo "dagger v0.18.0 linux/amd64"
            exit 0
          fi
          # For call commands, output something meaningful
          echo "hello from fake dagger"
          DAGGER_EOF
          chmod +x "$BIN_DIR/dagger"
          echo "Fake dagger installed to $BIN_DIR/dagger"
          INSTALL_EOF
          chmod +x /tmp/fake-dagger-install.sh

          # Create a fake curl
          mkdir -p /tmp/fake-bin
          cat > /tmp/fake-bin/curl << 'CURL_EOF'
          #!/bin/sh
          out=""
          prev=""
          for arg in "$@"; do
            case "$prev" in
              -o|--output) out="$arg" ;;
            esac
            prev="$arg"
          done
          case "$*" in
            *dagger/install.sh*|*dagger/versions/latest*)
              if echo "$*" | grep -q "versions/latest"; then
                echo "v0.18.0"
                exit 0
              fi
              if [ -n "$out" ]; then
                cat /tmp/fake-dagger-install.sh > "$out"
              else
                cat /tmp/fake-dagger-install.sh
              fi
              exit 0
              ;;
          esac
          exec /usr/bin/curl "$@"
          CURL_EOF
          chmod +x /tmp/fake-bin/curl
          echo "/tmp/fake-bin" >> $GITHUB_PATH

      - id: action
        uses: .
        with:
          version: "latest"
          call: "container --from=alpine:latest with-exec --args=echo,hello stdout"
          dagger-flags: "--progress plain"

      - name: Assert output contains expected content
        env:
          OUTPUT: ${{ steps.action.outputs.output }}
        run: |
          echo "output: '$OUTPUT'"
          if [ -z "$OUTPUT" ]; then
            echo "FAIL: expected non-empty output from dagger call"
            exit 1
          fi
          echo "PASS: got output from dagger call: $OUTPUT"

      - name: Assert dagger was called with call verb
        run: |
          if [ ! -f /tmp/dagger-calls.log ]; then
            echo "FAIL: dagger was never called (log file missing)"
            exit 1
          fi
          echo "Dagger call log:"
          cat /tmp/dagger-calls.log
          if ! grep -q "call" /tmp/dagger-calls.log; then
            echo "FAIL: expected 'call' verb in dagger invocation"
            exit 1
          fi
          echo "PASS: dagger was called with 'call' verb"
