name: Test deprecated engine-stop input (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: "latest"
          engine-stop: "true"
      - name: Assert dagger is installed despite deprecated input
        run: |
          echo "Checking dagger binary is available..."
          if ! command -v dagger &>/dev/null; then
            echo "FAIL: dagger binary not found in PATH"
            exit 1
          fi
          echo "PASS: dagger installed successfully with engine-stop (deprecated no-op) input"
          dagger version
      - name: Assert no output (install-only, engine-stop is no-op)
        env:
          ACTUAL: ${{ steps.action.outputs.output }}
        run: |
          echo "actual output: '$ACTUAL'"
          # engine-stop is deprecated and a no-op; no call/args/shell/check provided
          # so should-exec is false and output should be empty
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty output, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: output is empty as expected for no-op engine-stop"
