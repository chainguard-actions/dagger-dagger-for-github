name: Test engine-stop deprecated input (no-op)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          version: latest
          engine-stop: "true"
      - name: Assert dagger is installed
        run: |
          if ! command -v dagger &>/dev/null; then
            echo "FAIL: dagger binary not found after install"
            exit 1
          fi
          echo "PASS: dagger installed successfully, engine-stop input accepted as no-op"
